<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <title>Music Player</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --surface-1: #82817D;
      --surface-2: #696969;
      --Foreground: #ffffff;
      --muted: #d1d1d1;
      --border: #626262;
      --primary: #505050;

      /* Font */
      --font-main: "Noto Sans KR", sans-serif;

      /* Font Size */
      --text-sm: 10px;
      --text-md: 12px;
      --text-lg: 18px;
      --text-xl: 32px;

      @media (prefers-color-scheme: dark) {
        --background: #191919;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--Foreground);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }


    /* Layout */
    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Typography */
    .text-ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Interaction */
    button {
      /* all: unset; */
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      background: none;
      transition: background 0.2s ease, transform 0.3s ease, opacity 0.3s ease;

      border-radius: 12px;

      &:hover,
      &.active {
        transform: scale(0.95);
        opacity: 0.7;
      }
    }

    input {
      appearance: none;
      font: inherit;
      cursor: pointer;

      &[type="range"] {
        width: 100%;
        height: 3px;
        display: block;
        border-radius: 4px;
        background: linear-gradient(to right, var(--Foreground) var(--fill, 0%), var(--border) var(--fill, 0%));

        &::-webkit-slider-thumb {
          appearance: none;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          border: 2px solid var(--border);
          background: var(--Foreground);
          box-shadow: 0 0 0 1px var(--Foreground);
        }

        &::-moz-range-thumb {
          appearance: none;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          border: 2px solid var(--border);
          background: var(--Foreground);
          box-shadow: 0 0 0 1px var(--Foreground);
        }
      }
    }

    ol,
    ul {
      list-style: none;

      &::-webkit-scrollbar {
        width: 6px;
      }

      &::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      &::-webkit-scrollbar-thumb:hover {
        background: var(--surface-1);
      }
    }

    /* Animation */

    /* Components */
    .button {
      width: 40px;
      aspect-ratio: 1;
      border-radius: 8px;
      color: var(--muted);
      flex-shrink: 0;
      font-size: 20px;

      &.play-button {
        width: 48px;
        border-radius: 50%;
        background: var(--Foreground);
        color: var(--surface-1);
      }

      &:hover {
        background: var(--muted);
        color: var(--Foreground);
      }
    }


    .container {
      width: min(100%, 600px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 16px;
    }

    .wrapper__playing,
    .wrapper__playlist {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
    }

    .wrapper__playing {
      background: var(--surface-1);
    }

    .playing__info {
      display: flex;
      align-items: center;
      gap: 20px;

      .cover {
        object-fit: cover;
        width: 50%;
        aspect-ratio: 1;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .track {
        .category {
          margin: 0 0 12px 0;
          letter-spacing: .2em;
        }

        #title {}

        #artist {
          font-size: 12px;
          color: var(--muted);
        }
      }
    }

    .playing__actions {
      margin-top: 16px;

      .times {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 10px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 12px 0 12px;

        #volume {
          margin: 0 8px 0 0;
        }
      }
    }

    .wrapper__playlist {
      background: var(--surface-2);

      #Playlist__list {
        margin: 16px 0 0 0;
        max-height: 190px;
        overflow: auto;
      }
    }

    .song {
      width: 100%;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 12px 8px 12px 8px;
      text-align: left;
      position: relative;

      &:not(:last-child)::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 8px;
        right: 8px;
        height: 2px;
        background: linear-gradient(to right, transparent, var(--primary), transparent);
      }

      .song-number,
      .song-duration {
        color: var(--muted);
        font-size: 10px;
      }

      .song-name {
        font-size: 14px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      &:hover,
      &.active {
        background: var(--surface-1);
      }
    }

    @media (max-width: 450px) {
      body {
        padding: 0px;
      }

      .container {
        width: min(100%, 350px);
        height: min(100%, 500px);
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 5fr 4fr;
      }

      .wrapper__playing,
      .wrapper__playlist {
        min-height: 0;
      }

      .playing__actions {
        margin-top: 8px;

        .controls {
          margin-top: 12px;
          gap: 16px;
        }
      }

      .Playlist__header {
        display: none;
      }

      #Playlist__list {
        margin-top: 0px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="wrapper__playing">
      <div class="playing__info">
        <img class="cover" src="https://bit.ly/4zm5CIC" alt="앨범 커버">
        <div class="track" style="font-weight: 600;">
          <h1 class="category">LOFI</h1>
          <p id="title">no title</p>
          <p id="artist">no artist</p>
        </div>
      </div>
      <div class="playing__actions">
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생바">
        <div class="controls">
          <input id="volume" type="range" min="0" max="0.3" step="0.01" value="0.1" aria-label="볼륨바">
          <button class="button" id="previous" aria-label="이전 곡"><i class="fa-solid fa-backward"></i></button>
          <button class="button" id="next" aria-label="다음 곡"><i class="fa-solid fa-forward"></i></button>
          <button class="button play-button" id="play" aria-label="재생"><i class="fa-solid fa-play"></i></button>
        </div>
      </div>
    </section>
    <section class="wrapper__playlist">
      <div class="Playlist__header">
        <h3 style="font-weight: 600;">Playlist
          <span id="count" style="color:var(--muted);font-size:12px;font-weight:400">0</span>
        </h3>
      </div>
      <ul id="Playlist__list"></ul>
    </section>
  </main>
  <audio id="audio" preload="metadata"></audio>

  <script type="text/javascript" src="https://code.jquery.com/jquery-3.1.0.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script>
    const MAX_VOLUME = 100;
    const DEFAULT_VOLUME = 50;
    const TRACK_COUNT = 6;

    const seek = document.querySelector("#seek");
    const volume = document.querySelector("#volume");
    const playIcon = document.querySelector("#play i");
    const playlist = document.querySelector("#Playlist__list");
    const audio = document.querySelector("#audio");
    const tracks = [
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/LeeHi%20-%20H.S.K.T..mp3"
      },
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/Giriboy%20-%20%EC%97%89%EB%A7%9D%EC%A7%84%EC%B0%BD.mp3"
      },
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/BIG%20Naughty%20-%20Bravo.mp3"
      },
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/Yella%20-%20Rocket%20Boy.mp3"
      },
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/Ku%20one%20chan%20-%20%EC%8A%AC%ED%8D%BC%ED%95%98%EC%A7%80%EB%A7%88.mp3"
      },
      {
        url: "https://raw.githubusercontent.com/Heonjjj-ops/Widget/main/assets/music/Giriboy%20-%20Baby.mp3"
      }
    ];

    let currentTrack = -1;

    // jsmediatags: 제목과 아티스트 가져오기
    // audio: 재생 시간과 현재 재생 위치 가져오기

    // jsmediatags 메타데이터 읽기
    function loadTrackInfo(track) {
      return new Promise((resolve) => {

        jsmediatags.read(track.url, {
          onSuccess: function (result) {
            const tags = result.tags;

            resolve({
              ...track,
              title: tags.title || track.title || "Unknown Title",
              artist: tags.artist || track.artist || "Unknown Artist"
            });
          },

          onError: function (error) {
            console.error("메타데이터 오류 발생");

            resolve({
              ...track,
              title: track.title || "Unknown Title",
              artist: track.artist || "Unknown Artist"
            });
          }
        });
      });
    }

    // 곡 길이 메타데이터 가져오기
    function loadTrackDuration(track) {
      return new Promise((resolve) => {
        const tempAudio = new Audio();

        tempAudio.preload = "metadata"; // 미리 불러올 범위 설정

        tempAudio.addEventListener("loadedmetadata", () => {
          resolve(tempAudio.duration);
        }, { once: true });

        tempAudio.addEventListener("error", () => {
          resolve(undefined);
        }, { once: true });

        tempAudio.src = track.url; // 오디오 파일 읽기 요청
      });
    }

    // 시간 표시
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    }

    // 재생목록 화면 생성/갱신
    function renderPlaylist() {
      document.querySelector("#count").textContent = tracks.length;

      playlist.replaceChildren(); // 갱신을 위해 지움

      tracks.forEach((track, index) => {
        const button = document.createElement("button");
        button.className = `song${index === currentTrack ? " active" : ""}`;
        button.type = "button"; // 타입명시 submit으로 만들수도 있음

        const number = document.createElement("span");
        number.className = "song-number";
        number.textContent = index + 1;

        const name = document.createElement("span");
        name.className = "song-name";
        name.textContent = track.title;

        const duration = document.createElement("span");
        duration.className = "song-duration";
        duration.textContent = formatTime(track.duration);

        button.append(number, name, duration);

        button.addEventListener("click", () => playTrack(index));
        playlist.append(button);
      });
    }

    // 음악 재생
    function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;

      currentTrack = index;

      audio.src = tracks[index].url;

      document.querySelector("#title").textContent = tracks[index].title;
      document.querySelector("#artist").textContent = tracks[index].artist;

      seek.value = 0;
      setRangeFill(seek);

      audio.play().catch(error => {
        console.error("음악 재생 실패:", error);
      });

      renderPlaylist();
    }

    // 슬라이더 채우기
    function setRangeFill(input) {
      const percent =
        (input.value - input.min) /
        (input.max - input.min) * 100;

      input.style.setProperty("--fill", `${percent}%`);
    }

    // 재생/일시정지
    document.querySelector("#play").addEventListener("click", () => {
      if (currentTrack === -1) {
        if (tracks.length) playTrack(0);
        return;
      }

      if (audio.paused) {
        audio.play().catch(console.error);
      } else {
        audio.pause();
      }
    });

    // 이전 곡 재생
    document.querySelector("#previous").addEventListener("click", () => {
      if (tracks.length === 0) return;
      playTrack((currentTrack - 1 + tracks.length) % tracks.length);
    });

    // 다음 곡 재생
    document.querySelector("#next").addEventListener("click", () => {
      if (tracks.length === 0) return;
      playTrack((currentTrack + 1) % tracks.length);
    });

    // 음악 정보 로드
    audio.addEventListener("loadedmetadata", () => { // 브라우저가 발생시키는 이벤트 / audio.src
      if (currentTrack < 0) return;

      document.querySelector("#duration").textContent =
        formatTime(tracks[currentTrack].duration);

      renderPlaylist();
    });

    // 재생 위치 업데이트
    audio.addEventListener("timeupdate", () => {
      document.querySelector("#elapsed").textContent =
        formatTime(audio.currentTime);

      seek.value = audio.duration
        ? audio.currentTime / audio.duration * 1000
        : 0;

      setRangeFill(seek);
    });

    // 재생 아이콘 변경
    audio.addEventListener("play", () => {
      playIcon.classList.replace("fa-play", "fa-pause");
      document.querySelector("#play").setAttribute("aria-label", "일시정지");
    });
    audio.addEventListener("pause", () => {
      playIcon.classList.replace("fa-pause", "fa-play");
      document.querySelector("#play").setAttribute("aria-label", "재생");
    });

    // 음악 종료 이벤트
    audio.addEventListener("ended", () => {
      if (currentTrack < tracks.length - 1) {
        playTrack(currentTrack + 1);
      }
    });

    // 오디오 오류 처리
    audio.addEventListener("error", () => {
      console.error(
        "오디오 파일을 불러오지 못했습니다.",
        audio.error
      );
    });

    // 재생 위치 이동
    seek.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime =
          seek.value / 1000 * audio.duration;
      }
      setRangeFill(seek);
    });

    // 볼륨 조절
    volume.addEventListener("input", () => {
      audio.volume = volume.value;
      setRangeFill(volume);
    });


    // 초기화
    async function initializePlayer() {
      audio.volume = volume.value;

      setRangeFill(seek);
      setRangeFill(volume);

      renderPlaylist(); // 메타데이터를 기다리지 않고 즉시 리스트 표시

      // 메타데이터 비동기 로딩
      const loadedTracks = await Promise.all(
        tracks.map(async (track) => {
          const [info, duration] = await Promise.all([
            loadTrackInfo(track),
            loadTrackDuration(track)
          ]);

          return {
            ...info,
            duration
          };
        })
      );

      // 메타데이터 적용
      tracks.splice(0, tracks.length, ...loadedTracks);

      // 리스트 갱신
      renderPlaylist();
    }

    initializePlayer().catch(error => {
      console.error("플레이어 초기화 실패:", error);
    });
  </script>
</body>

</html>
