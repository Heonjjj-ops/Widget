<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <title>Music Player</title>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --surface-1: #808080;
      --surface-2: #696969;
      --Foreground: #ffffff;
      --muted: #d1d1d1;
      --border: #626262;
      --primary: #505050;

      /* Font */
      --font-main: "Noto Sans KR", sans-serif;

      /* Font Size */
      --text-sm: 10px;
      --text-md: 12px;
      --text-lg: 18px;
      --text-xl: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--Foreground);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .container {
      width: min(100%, 600px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 16px;
    }

    .wrapper__playing,
    .wrapper__library {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
    }

    .wrapper__playing {
      background: var(--surface-1);
    }

    .playing__info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .cover {
      width: 50%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .track {}

    .category {
      margin: 0 0 12px 0;
      letter-spacing: .2em;
    }

    #title {}

    #artist {
      font-size: 12px;
      color: var(--muted);
    }

    /* 조작 바 */
    .playing__actions {
      margin-top: 16px;
    }

    .times {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
    }

    input[type="range"] {
      appearance: none;
      width: 100%;
      height: 3px;
      display: block;
      border-radius: 4px;
      background: linear-gradient(to right, var(--Foreground) var(--fill, 0%), var(--border) var(--fill, 0%));
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--Foreground);
      box-shadow: 0 0 0 1px var(--Foreground);
    }

    input[type="range"]::-moz-range-thumb {
      appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--Foreground);
      box-shadow: 0 0 0 1px var(--Foreground);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 0 0;
    }

    .button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
    }

    .button--primary {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--Foreground);
      color: var(--surface-1);
    }

    .button:hover {
      color: var(--Foreground);
      background: var(--muted);
    }

    .wrapper__library {
      background: var(--surface-2);
    }

    #library__list {
      margin: 16px 0 0 0;
      max-height: 190px;
      overflow: auto;
      list-style: none;
    }

    #library__list::-webkit-scrollbar {
      width: 6px;
    }

    #library__list::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    #library__list::-webkit-scrollbar-thumb:hover {
      background: var(--surface-1);
    }

    .song {
      width: 100%;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 12px 8px 12px 8px;
      text-align: left;
      cursor: pointer;

      background: transparent;
      border: 0;
      border-radius: 12px;
      transition: background 0.2s ease, transform 0.3s ease, opacity 0.3s ease;

      position: relative;
    }

    .song:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--primary), transparent);
    }

    .song:hover,
    .song.active {
      background: var(--surface-1);
      transform: scale(0.95);
      opacity: 0.5;
    }

    .song-number,
    .song-duration {
      color: var(--muted);
      font-size: 10px;
    }

    .song-name {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 450px) {
      body {
        padding: 0px;
      }

      .container {
        width: min(100%, 350px);
        height: min(100%, 500px);
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 6fr 4fr;
      }

      .wrapper__playing,
      .wrapper__library {
        min-height: 0;
        padding: 18px;
      }

      .playing__actions {
        margin-top: 6px;
      }

      .controls {
        margin-top: 6px;
      }

      .library__header h3 {
        display: none;
      }

      #library__list {
        margin-top: 0px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="wrapper__playing">
      <div class="playing__info">
        <img class="cover" src="https://bit.ly/4zm5CIC" alt="앨범 커버">
        <div class="track" style="font-weight: 600;">
          <h1 class="category">LOFI</h1>
          <p id="title">no title</p>
          <p id="artist">no artist</p>
        </div>
      </div>
      <div class="playing__actions">
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
        <input id="actions__seek" type="range" min="0" max="1000" value="0" aria-label="재생바">
        <div class="controls">
          <input id="actions__volume" type="range" min="0" max="1" step="0.01" value="0.1" aria-label="볼륨바">
          <button class="button" id="previous" aria-label="이전 곡"><i class="fa-solid fa-backward"></i></button>
          <button class="button" id="next" aria-label="다음 곡"><i class="fa-solid fa-forward"></i></button>
          <button class="button button--primary" id="play" aria-label="재생"><i class="fa-solid fa-play"></i></button>
        </div>
      </div>
    </section>
    <section class="wrapper__library">
      <div class="library__header">
        <h3 style="font-weight: 600;">Playlist
          <span id="count" style="color:var(--muted);font-size:12px;font-weight:400">0</span>
        </h3>
      </div>
      <ul id="library__list"></ul>
    </section>
  </main>
  <audio id="audio" preload="metadata"></audio>

  <script type="text/javascript" src="https://code.jquery.com/jquery-3.1.0.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script>

    const seek = document.querySelector("#actions__seek");
    const volume = document.querySelector("#actions__volume");
    const playIcon = document.querySelector("#play i");
    const playlist = document.querySelector("#library__list");
    const audio = document.querySelector("#audio");

    const tracks = [
      { url: "https://bit.ly/4C2KWaY" },
      { url: "https://bit.ly/4zMfcWk" },
      { url: "https://bit.ly/4zLioRZ" },
      { url: "https://bit.ly/4sV71Eh" },
      { url: "https://bit.ly/4kRBxgh" },
      { url: "https://bit.ly/4sYC7Lj" }
    ];

    let current = -1;

    // 시간 표시
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      return `${Math.floor(seconds / 60)}:${String(
        Math.floor(seconds % 60)
      ).padStart(2, "0")}`;
    }

    // 메타데이터 읽기
    function loadTrackInfo(track) {
      return new Promise((resolve) => {

        jsmediatags.read(track.url, {
          onSuccess: function (result) {
            const tags = result.tags;

            resolve({
              ...track,
              title: tags.title || track.title || "Unknown Title",
              artist: tags.artist || track.artist || "Unknown Artist"
            });
          },

          onError: function (error) {
            console.error("메타데이터 오류 발생");
            console.error("오류 유형:", error.type);
            console.error("오류 내용:", error.info);
            console.error("전체 오류:", error);

            resolve({
              ...track,
              title: track.title || "Unknown Title",
              artist: track.artist || "Unknown Artist"
            });
          }
        });
      });
    }

    // 재생목록 표시
    function renderPlaylist() {
      document.querySelector("#count").textContent = tracks.length;

      playlist.replaceChildren();

      tracks.forEach((track, index) => {
        const button = document.createElement("button");

        button.className =
          `song${index === current ? " active" : ""}`;

        button.type = "button";

        button.innerHTML = `
      <span class="song-number">${String(index + 1).padStart(2, "0")}</span>
      <span class="song-name"></span>
      <span class="song-duration">${formatTime(track.duration)}</span>
    `;

        button.querySelector(".song-name").textContent = track.title;

        button.addEventListener("click", () => playTrack(index));

        playlist.append(button);
      });
    }

    // 곡 재생
    function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;

      current = index;

      audio.src = tracks[index].url;

      document.querySelector("#title").textContent =
        tracks[index].title;

      document.querySelector("#artist").textContent =
        tracks[index].artist;

      document.querySelector("#elapsed").textContent = "0:00";
      document.querySelector("#duration").textContent = "0:00";

      seek.value = 0;
      setRangeFill(seek);

      audio.play().catch(error => {
        console.error("음악 재생 실패:", error);
      });

      renderPlaylist();
    }

    // 슬라이더 채우기
    function setRangeFill(input) {
      const percent =
        (input.value - input.min) /
        (input.max - input.min) * 100;

      input.style.setProperty("--fill", `${percent}%`);
    }

    // 재생 / 일시정지
    document.querySelector("#play").addEventListener("click", () => {
      if (current === -1) {
        if (tracks.length) playTrack(0);
        return;
      }

      if (audio.paused) {
        audio.play().catch(console.error);
      } else {
        audio.pause();
      }
    });

    // 이전 곡
    document.querySelector("#previous").addEventListener("click", () => {
      if (current > 0) {
        playTrack(current - 1);
      }
    });

    // 다음 곡
    document.querySelector("#next").addEventListener("click", () => {
      if (current < tracks.length - 1) {
        playTrack(current + 1);
      }
    });

    // 음악 정보 로드
    audio.addEventListener("loadedmetadata", () => {
      if (current < 0) return;

      tracks[current].duration = audio.duration;

      document.querySelector("#duration").textContent =
        formatTime(audio.duration);

      renderPlaylist();
    });

    // 재생 위치 업데이트
    audio.addEventListener("timeupdate", () => {
      document.querySelector("#elapsed").textContent =
        formatTime(audio.currentTime);

      seek.value = audio.duration
        ? audio.currentTime / audio.duration * 1000
        : 0;

      setRangeFill(seek);
    });

    // 재생 아이콘 일시정지 아이콘으로 변경
    audio.addEventListener("play", () => {
      playIcon.classList.replace("fa-play", "fa-pause");
      document.querySelector("#play").setAttribute("aria-label", "일시정지");
    });
    audio.addEventListener("pause", () => {
      playIcon.classList.replace("fa-pause", "fa-play");
      document.querySelector("#play").setAttribute("aria-label", "재생");
    });

    // 곡 종료 시 다음 곡
    audio.addEventListener("ended", () => {
      if (current < tracks.length - 1) {
        playTrack(current + 1);
      }
    });

    // 재생 위치 이동
    seek.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime =
          seek.value / 1000 * audio.duration;
      }

      setRangeFill(seek);
    });

    // 볼륨
    volume.addEventListener("input", () => {
      audio.volume = volume.value;
      setRangeFill(volume);
    });

    // 오디오 오류
    audio.addEventListener("error", () => {
      console.error(
        "오디오 파일을 불러오지 못했습니다.",
        audio.error
      );
    });

    // 초기화
    async function initializePlayer() {
      audio.volume = volume.value;

      setRangeFill(seek);
      setRangeFill(volume);

      // 메타데이터를 기다리지 않고 즉시 리스트 표시
      renderPlaylist();

      if (tracks.length > 0) {
        document.querySelector("#title").textContent =
          tracks[0].title;

        document.querySelector("#artist").textContent =
          tracks[0].artist;
      }

      // 메타데이터 비동기 로딩
      const loadedTracks = await Promise.all(
        tracks.map(track => loadTrackInfo(track))
      );

      // 메타데이터 적용
      tracks.splice(0, tracks.length, ...loadedTracks);

      // 리스트 갱신
      renderPlaylist();
    }
    initializePlayer();


  </script>
</body>

</html>
