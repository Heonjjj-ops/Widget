<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still — Music Player</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #272824;
      --muted: #989990;
      --line: #e9e9e4;
      --paper: #f5f5f2;
      --sage: #c5cbbc;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .player {
      width: min(900px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 60px #20221a0b;
    }
    .now-playing, .library { padding: 32px; }
    .now-playing {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid var(--line);
    }
    .brand {
      width: 100%;
      margin-bottom: 24px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
    }
    .cover {
      width: min(100%, 330px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      overflow: hidden;
      border-radius: 14px;
      background: radial-gradient(circle at 45% 38%, #eceee7, #cbd1c2 58%, #aeb6a4);
    }
    .cover::after {
      width: 55%;
      aspect-ratio: 1;
      border: 1px solid #ffffff80;
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 34px #ffffff18, 0 0 0 68px #ffffff12;
    }
    .track { width: 100%; text-align: center; }
    .track h1 { margin: 0 0 5px; font-size: 19px; font-weight: 600; }
    .track p { margin: 0; color: var(--muted); font-size: 12px; }
    .transport { width: min(100%, 360px); margin-top: 24px; }
    .times { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 10px; }
    input[type="range"] {
      width: 100%;
      height: 3px;
      display: block;
      appearance: none;
      border-radius: 4px;
      background: linear-gradient(to right, var(--ink) var(--fill, 0%), var(--line) var(--fill, 0%));
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      width: 11px; height: 11px; appearance: none;
      border: 2px solid white; border-radius: 50%;
      background: var(--ink); box-shadow: 0 0 0 1px var(--ink);
    }
    input[type="range"]::-moz-range-thumb {
      width: 8px; height: 8px; border: 2px solid white;
      border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--ink);
    }
    .controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 18px; }
    .icon-button {
      width: 36px; height: 36px; display: grid; place-items: center;
      padding: 0; border: 0; background: none; color: #777970; cursor: pointer;
    }
    .icon-button svg { width: 18px; height: 18px; fill: currentColor; }
    .icon-button:hover { color: var(--ink); }
    .icon-button.primary { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: white; }
    .icon-button.primary svg { width: 17px; height: 17px; }
    .volume { width: min(100%, 240px); margin: 16px auto 0; }

    .library { min-width: 0; }
    .library-head { display: flex; align-items: center; justify-content: space-between; margin: 3px 0 22px; }
    .library h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .add-button {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 20px;
      background: white; font-size: 11px; cursor: pointer;
    }
    .add-button:hover { background: var(--paper); }
    .playlist { max-height: 410px; margin: 0; padding: 0; overflow: auto; list-style: none; }
    .song {
      width: 100%; display: grid; grid-template-columns: 24px 1fr auto; gap: 10px;
      align-items: center; padding: 13px 9px; border: 0; border-bottom: 1px solid #f0f0ec;
      border-radius: 7px; background: transparent; text-align: left; cursor: pointer;
    }
    .song:hover, .song.active { background: #f7f7f4; }
    .song-number, .song-duration { color: var(--muted); font-size: 10px; }
    .song-name { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .empty { padding: 24px 8px; color: var(--muted); font-size: 12px; }
    audio { display: none; }

    dialog {
      width: min(380px, calc(100% - 32px)); padding: 24px;
      border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 20px 60px #20221a22;
    }
    dialog::backdrop { background: #24251f66; }
    dialog h2 { margin: 0 0 18px; font-size: 18px; }
    .field { display: block; margin: 12px 0; color: #65675f; font-size: 11px; }
    .field input { width: 100%; margin-top: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; outline-color: var(--sage); font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .dialog-actions button { padding: 9px 13px; border: 1px solid var(--line); border-radius: 7px; background: white; font-size: 11px; cursor: pointer; }
    .dialog-actions .save { border-color: var(--ink); background: var(--ink); color: white; }

    @media (max-width: 680px) {
      body { padding: 12px; }
      .player { max-width: 460px; grid-template-columns: 1fr; }
      .now-playing { padding: 24px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { margin-bottom: 17px; }
      .cover { width: min(72vw, 280px); margin-bottom: 19px; }
      .library { padding: 24px; }
    }
  </style>
</head>
<body>
  <main class="player">
    <section class="now-playing">
      <div class="brand">STILL</div>
      <div class="cover" aria-hidden="true"></div>
      <div class="track">
        <h1 id="track-title">곡을 선택해 주세요</h1>
        <p id="track-artist"></p>
      </div>
      <div class="transport">
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
        <div class="controls">
          <button class="icon-button" id="previous" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm13 1v12L9 12z"/></svg></button>
          <button class="icon-button primary" id="toggle" aria-label="재생"><svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="icon-button" id="next" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 6v12l10-6z"/></svg></button>
        </div>
        <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="볼륨">
      </div>
    </section>

    <section class="library">
      <div class="library-head">
        <h2>Playlist <span id="count" style="color:var(--muted);font-size:12px;font-weight:400">0</span></h2>
        <button class="add-button" id="open-dialog">＋ 추가</button>
      </div>
      <ol class="playlist" id="playlist"><li class="empty">재생목록이 비어 있어요.</li></ol>
    </section>
  </main>

  <dialog id="add-dialog">
    <form id="add-form">
      <h2>곡 추가</h2>
      <label class="field">곡 제목<input name="title" required placeholder="곡 제목"></label>
      <label class="field">아티스트<input name="artist" placeholder="아티스트"></label>
      <label class="field">GitHub 파일 주소<input name="url" type="url" required placeholder="https://github.com/.../blob/.../song.mp3"></label>
      <div class="dialog-actions">
        <button type="button" id="cancel">취소</button>
        <button class="save" type="submit">추가</button>
      </div>
    </form>
  </dialog>
  <audio id="audio" preload="metadata"></audio>

  <script>
    const audio = document.querySelector("#audio");
    const playlist = document.querySelector("#playlist");
    const dialog = document.querySelector("#add-dialog");
    const form = document.querySelector("#add-form");
    const seek = document.querySelector("#seek");
    const volume = document.querySelector("#volume");
    const tracks = [];
    let current = -1;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    }

    function directAudioUrl(url) {
      return url.replace("https://github.com/", "https://raw.githubusercontent.com/")
        .replace("/blob/", "/");
    }

    function renderPlaylist() {
      document.querySelector("#count").textContent = tracks.length;
      playlist.replaceChildren();
      if (!tracks.length) {
        playlist.innerHTML = '<li class="empty">재생목록이 비어 있어요.</li>';
        return;
      }
      tracks.forEach((track, index) => {
        const button = document.createElement("button");
        button.className = `song${index === current ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `<span class="song-number">${String(index + 1).padStart(2, "0")}</span><span class="song-name"></span><span class="song-duration">${formatTime(track.duration)}</span>`;
        button.querySelector(".song-name").textContent = track.title;
        button.addEventListener("click", () => playTrack(index));
        playlist.append(button);
      });
    }

    function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      current = index;
      audio.src = tracks[index].url;
      document.querySelector("#track-title").textContent = tracks[index].title;
      document.querySelector("#track-artist").textContent = tracks[index].artist;
      audio.play().catch(() => {});
      renderPlaylist();
    }

    function setRangeFill(input) {
      const percent = (input.value - input.min) / (input.max - input.min) * 100;
      input.style.setProperty("--fill", `${percent}%`);
    }

    document.querySelector("#open-dialog").addEventListener("click", () => dialog.showModal());
    document.querySelector("#cancel").addEventListener("click", () => dialog.close());
    form.addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(form);
      tracks.push({
        title: data.get("title").trim(),
        artist: data.get("artist").trim(),
        url: directAudioUrl(data.get("url").trim()),
        duration: 0
      });
      renderPlaylist();
      if (current === -1) playTrack(0);
      form.reset();
      dialog.close();
    });

    document.querySelector("#toggle").addEventListener("click", () => {
      if (current === -1) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
    document.querySelector("#previous").addEventListener("click", () => {
      if (current > 0) playTrack(current - 1);
    });
    document.querySelector("#next").addEventListener("click", () => {
      if (current < tracks.length - 1) playTrack(current + 1);
    });
    audio.addEventListener("loadedmetadata", () => {
      if (current < 0) return;
      tracks[current].duration = audio.duration;
      document.querySelector("#duration").textContent = formatTime(audio.duration);
      renderPlaylist();
    });
    audio.addEventListener("timeupdate", () => {
      document.querySelector("#elapsed").textContent = formatTime(audio.currentTime);
      seek.value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0;
      setRangeFill(seek);
    });
    audio.addEventListener("play", () => {
      document.querySelector("#play-icon").innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    });
    audio.addEventListener("pause", () => {
      document.querySelector("#play-icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    });
    audio.addEventListener("ended", () => {
      if (current < tracks.length - 1) playTrack(current + 1);
    });
    seek.addEventListener("input", () => {
      if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
      setRangeFill(seek);
    });
    volume.addEventListener("input", () => {
      audio.volume = volume.value;
      setRangeFill(volume);
    });
    audio.volume = volume.value;
    setRangeFill(seek);
    setRangeFill(volume);
  </script>
</body>
</html>
